# DEMO ONLY: two Lumenward servers on one machine, to try a two-server recovery setup.
# Real recovery needs servers run by independent operators. Two containers you
# control are NOT independent.
#
#   export KEK_A=$(npm run -s keygen) KEK_B=$(npm run -s keygen)
#   export SEP10_JWT_SECRET=some-long-dev-secret-at-least-32-chars
#   docker compose up --build
services:
  lumenward-a:
    build: .
    ports: ["8081:8080"]
    environment:
      KEY_ENCRYPTION_KEY: ${KEK_A:?set KEK_A, see the comments at the top of this file}
      SEP10_JWT_SECRET: ${SEP10_JWT_SECRET:?set SEP10_JWT_SECRET}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
    volumes: ["data-a:/data"]
  lumenward-b:
    build: .
    ports: ["8082:8080"]
    environment:
      KEY_ENCRYPTION_KEY: ${KEK_B:?set KEK_B, see the comments at the top of this file}
      SEP10_JWT_SECRET: ${SEP10_JWT_SECRET:?set SEP10_JWT_SECRET}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
    volumes: ["data-b:/data"]
volumes:
  data-a:
  data-b:
